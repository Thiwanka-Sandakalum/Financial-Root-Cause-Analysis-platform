[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
dependencies = [
  # Core
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "typing-extensions>=4.12.0", # Database
  "neo4j>=5.24.0", # LLM / LangChain
  "langsmith>=0.1.95",
  "langgraph>=0.2.0",
  "langgraph-cli[inmem]>=0.4.0",
  "langchain-core>=0.2.30",
  "langchain-google-genai>=2.0.0",
  "langchain-text-splitters>=0.2.2", # Document parsing
  "llama-cloud>=0.1.8", # API
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9", # Evaluation
  "ragas>=0.2.0",
  "pandas>=2.2.0",
]
description = "RootAlpha GraphRAG pipeline and evaluation tooling"
name = "rootalpha"
readme = "evals/README.md"
requires-python = ">=3.11"
version = "0.1.0"

[project.scripts]
rootalpha-api = "ingestion.api.main:app"
rootalpha-eval = "evals.ragas_eval:main"
rootalpha-eval-default = "evals.commands:eval_default"
rootalpha-eval-ref = "evals.commands:eval_reference"
rootalpha-eval-ref-trace = "evals.commands:eval_reference_trace"
rootalpha-query-api = "query.api.main:app"

[tool.hatch.build.targets.wheel]
packages = [
  "evals",
  "graph",
  "ingestion",
  "query",
]

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
