version: '3.8'

services:
  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.24.0-community
    container_name: rootalpha-neo4j
    ports:
      - "7474:7474" # Neo4j Browser (HTTP)
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/password123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password123 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Ingestion API
  ingestion-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rootalpha-ingestion-api
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password123
      - GOOGLE_GENAI_USE_VERTEXAI=true
      - GOOGLE_CLOUD_PROJECT=development-498315
      - GOOGLE_CLOUD_LOCATION=asia-southeast1
      - GEMINI_FAST_MODEL=gemini-2.5-flash
      - GEMINI_EMBEDDING_MODEL=text-embedding-004
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env
      - ~/.config/gcloud:/root/.config/gcloud:ro

  # LangGraph Agent / Query Server
  query-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rootalpha-query-agent
    command: ["langgraph", "dev", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=password123
      - GOOGLE_GENAI_USE_VERTEXAI=true
      - GOOGLE_CLOUD_PROJECT=development-498315
      - GOOGLE_CLOUD_LOCATION=asia-southeast1
      - GEMINI_FAST_MODEL=gemini-2.5-flash
      - GEMINI_EMBEDDING_MODEL=text-embedding-004
      - GOOGLE_APPLICATION_CREDENTIALS=/root/.config/gcloud/application_default_credentials.json
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./.env:/app/.env
      - .:/app
      - ~/.config/gcloud:/root/.config/gcloud:ro

volumes:
  neo4j_data:
  neo4j_logs:
