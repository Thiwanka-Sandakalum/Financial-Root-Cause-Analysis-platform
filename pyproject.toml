[project]
dependencies = [
  "langchain>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-google-genai>=2.0.0",
  "langchain-text-splitters>=0.3.0",
  "langgraph>=0.2.0",
  "neo4j>=5.22.0",
  "pdfplumber>=0.11.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pypdf>=5.5.0",
  "python-dotenv>=1.0.1",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "aiofiles>=24.1.0",
  "tiktoken>=0.5.0",
  "rank-bm25>=0.2.2",
]
description = "Stock Investment Intelligence Assistant foundation"
name = "rootalpha"
requires-python = ">=3.11"
version = "0.1.0"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ragas>=0.2.0",
  "langchain-google-vertexai>=2.0.0",
  "langgraph-cli[inmem]>=0.1.0",
  "google-genai>=1.0.0",
  "litellm>=1.0.0",
]
observability = [
  "langsmith>=0.1.0",
]

[project.scripts]
ask = "src.query.service:main"
health-check = "src.health_check:main"
ingest-documents = "src.ingestion.service:main"
setup-schema = "src.db.neo4j_setup:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true
