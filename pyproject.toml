[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.25.0"]

[project]
dependencies = [
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.0",
  "typing-extensions>=4.12.0",
  "neo4j>=5.24.0",
  "langsmith>=0.1.95",
  "langgraph>=0.2.0",
  "langgraph-cli[inmem]>=0.4.0",
  "langchain-core>=0.2.30",
  "langchain-google-genai>=2.0.0",
  "langchain-text-splitters>=0.2.2",
  "ragas>=0.2.0",
  "pandas>=2.2.0",
  "llama-cloud>=0.1.8",
]
description = "RootAlpha GraphRAG pipeline and evaluation tooling"
name = "rootalpha"
readme = "evals/README.md"
requires-python = ">=3.11"
version = "0.1.0"

[project.scripts]
rootalpha-eval = "evals.ragas_eval:main"
rootalpha-eval-default = "evals.commands:eval_default"
rootalpha-eval-ref = "evals.commands:eval_reference"
rootalpha-eval-ref-trace = "evals.commands:eval_reference_trace"

[tool.hatch.build.targets.wheel]
packages = [
  "agent",
  "evals",
  "graph",
  "ingestion",
  "retrieval",
]

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.0",
]
